[project]
name = "spond-calendar"
version = "1.1.0"
description = "Home Assistant custom integration – Spond group events as a calendar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"

# Runtime requirements are declared in custom_components/spond_calendar/manifest.json
# and installed by Home Assistant.
dependencies = []

[project.optional-dependencies]
dev = [
    "homeassistant",
    "spond==1.2.1",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.spond_calendar"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
follow_imports = "silent"
